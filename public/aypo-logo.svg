<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A9D8F" />
      <stop offset="100%" stop-color="#06D6A0" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Base (Safety) -->
  <path d="M50 8 L85 24 V52 C85 74 69 90 50 96 C31 90 15 74 15 52 V24 Z" 
        fill="#0B132B" stroke="url(#shieldGrad)" stroke-width="4" stroke-linejoin="round"/>

  <!-- Radar Pulse Rings (Location / Search) -->
  <circle cx="50" cy="50" r="30" stroke="#00B4D8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>
  <circle cx="50" cy="50" r="18" stroke="#2A9D8F" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Connecting Arcs (Reunification & Connection) -->
  <path d="M30 62 C34 46, 66 46, 70 62" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Person Left (Reaching Out) -->
  <circle cx="36" cy="42" r="5" fill="#00B4D8"/>
  <path d="M29 55 C29 48, 43 48, 43 55" stroke="#00B4D8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Person Right (Reconnecting) -->
  <circle cx="64" cy="42" r="5" fill="#06D6A0"/>
  <path d="M57 55 C57 48, 71 48, 71 55" stroke="#06D6A0" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Central Reunion Beacon / Location Node -->
  <circle cx="50" cy="48" r="4.5" fill="#FFFFFF" filter="url(#neon)"/>
  <circle cx="50" cy="48" r="2" fill="#FB8500"/>
</svg>
